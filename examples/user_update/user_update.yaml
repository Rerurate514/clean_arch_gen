feature_name: UserProfileManagement

domain:
  entities:
    - User:
        fields:
          id: String
          name: String
          bio: String
          profileImageUrl: String
  usecases:
    - GetUserProfileUsecase:
        method:
          returns: Future<User>
          params:
            - userId: String
          isAsync: true
    - UpdateUserProfileUsecase:
        method:
          returns: Future<User>
          params:
            - userId: String
            - name: String
            - bio: String
          isAsync: true
  repositories:
    - UserRepository:
        methods:
          - findById:
              returns: Future<User>
              params:
                - userId: String
              isAsync: true
          - update:
              returns: Future<User>
              params:
                - user: User
              isAsync: true

infrastructure:
  datasources:
    - UserApiDatasource:
        methods:
          - fetchProfile:
              returns: Future<UserResponse>
              params:
                - userId: String
              isAsync: true
          - updateProfile:
              returns: Future<UserResponse>
              params:
                - userId: String
                - data: Map<String, dynamic>
              isAsync: true
  responses:
    - UserResponse

presentation:
  pages:
    - Profile
    - EditProfile
  notifiers:
    - ProfileUpdateNotifier
